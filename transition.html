<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transition</title>
    <style>
        .box{
            display: grid;
            text-align: center;
            align-items: center;
            width: 100px ;
            height: 100px;
            border: 2px solid tomato;
            background-color: peachpuff;
            /*transition: width 5s linear 1s, background-color 3s ;*/
            border-radius: 10px;
            margin-bottom: 10px;
            transition: transform 1s;

        }
        .box img{
            width: 100px;
            height: 100px;
            
        }
        .box:hover{
            /*width: 400px;*/
           
            background-color: rgb(255, 254, 254);
            transform: rotate(360deg) scale(1.5) translateX(150px);
           
        }
    </style>
</head>
<body>
    <ul>
        <li>Transform: change the shape. this is a css style poperty name </li>
        <li>translate: is is a value of the transformstyle rule.  this means you move either x, or y or both axis</li>
        <li>transition: how long it will take to do the change of the shape or color</li>
    </ul>
    <div class="box"><img src="shoe-3.png" alt=""></div>
    <div class="box"><img src="shoe-2.png" alt=""></div>
    <div class="box"><img src="shoe-1.png" alt=""></div>
</body>
</html>
